# Runink River live medium: weston as a kiosk, showing the graphical installer.
#
# Live-overlay only. An installed workstation has Plasma and never reads this.
#
# This is what river-kiosk starts when the desktop did not come up. weston reads this file from
# /etc/xdg/weston/weston.ini when the user has none of their own, so the kiosk needs no per-user
# setup and no writable home.

[core]
# kiosk-shell: one application, fullscreen, no panel, no launcher, nothing to click away into.
# That is the whole requirement, and it is a shell weston ships for exactly this.
shell=kiosk-shell.so
# Xwayland is not needed: firefox speaks Wayland. Leaving it off removes an X server from the
# live medium's attack surface and one more thing that can fail to start.
xwayland=false
# No idle timeout. The installer sits on the recovery-key screen while somebody writes down 64
# characters, and a compositor that blanks or locks in the middle of that would strand them --
# the live session has no password they would know. 0 disables it.
idle-time=0

[autolaunch]
# The SAME launcher the Plasma session autostarts. weston runs as root -- the only way to take
# the DRM device without a logind session -- so the launcher sees euid 0 and drops to the live
# user itself before starting firefox. One definition of what the installer looks like, and
# exactly one privileged process: the compositor.
path=/usr/local/bin/river-installer-desktop
# watch=true makes weston exit when this process exits. That matters: river-live-fallback only
# moves on to the text installer when river-kiosk EXITS, so a compositor that outlived a dead
# browser would hang the fallback chain on a black screen.
watch=true

[shell]
# A plain background for the moment before the browser paints, in River's own palette rather
# than weston's default desert photograph.
background-color=0xff212121
