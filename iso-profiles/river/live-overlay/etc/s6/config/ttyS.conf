# Runink River live medium: the serial getty, on the port x86_64 actually has.
#
# The packaged default is TTY="ttyAMA0" -- the ARM PL011 port. On x86_64 that device does not
# exist, so the service spawned a getty on nothing and the medium had NO SERIAL LOGIN. The
# symptom is silence: `console=ttyS0` puts kernel messages on the wire, so the port looks alive,
# and then no prompt ever appears.
#
# That is what makes a failing machine undiagnosable. On 2026-10-03 the owner's laptop reached
# the text installer with a keyboard they described as "insanely hard to type", and there was no
# way in: no desktop, no Wi-Fi (no netdev at all), and no serial console. The only channel left
# was photographs of the screen.
#
# A serial login costs nothing on a machine with no serial port -- the 8250 driver still creates
# /dev/ttyS0 and agetty simply waits on it -- and on anything with a port or a VM it is the
# difference between diagnosing a boot and guessing at one.

# Option to actually spawn the getty when the service starts. Set to "yes" to enable.
SPAWN="yes"

# Arbitrary arguments to pass to getty. --autologin matches tty1/tty2: this is an installer
# medium whose live password is published in this repository, so the prompt protects nothing and
# only stops the person it is meant to help.
ARGS="--autologin runink --noclear"

# Getty program to use.
GETTY="agetty"

# Serial tty address and baud rate. ttyS0 is the x86_64 port; 115200 matches the console= the
# installed system's GRUB entry uses (installer/lib/40-boot-grub-zfs.sh).
TTY="ttyS0"
BAUD_RATE="115200"
