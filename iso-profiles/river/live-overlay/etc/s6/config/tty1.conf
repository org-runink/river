# Runink River live medium: tty1 runs NO getty, because the display manager (greetd, vt = 1)
# puts the live session there and the two cannot share the VT. Measured under SDDM:
#
# WITH SPAWN="yes" (this file, 2026-10-16 to 2026-10-18) an autologin getty held VT 1. SDDM
# ignores MinimumVT in Wayland mode, took VT 1 anyway, lost the TTY to the getty and
# respawned forever:
#   Greeter stopped. SDDM::Auth::HELPER_TTY_ERROR  /  Jumping to VT 1
# Measured on the 2026-10-18 ISO in QEMU: 4,638 log lines and 194 crashes, sddm-srv never
# older than 0 s, the screen black. The medium therefore ALWAYS fell through to the text
# console -- "it gets into the console", the owner's report. Setting SPAWN="no" and
# restarting sddm on that same booted ISO ended it: 0 crashes, sddm up 42 s,
#   Starting Wayland user session: /usr/bin/startplasma-wayland  /  Session started true
# with kwin_wayland and startplasma-wayland running.
#
# The 2026-10-03 requirement this file was written for -- "the last image is what needs to
# start over the flash disk, not asking the user to login" -- is NOT lost. It is met by the
# path that was always meant to meet it: river-live-fallback waits for the desktop and, if
# none appears, opens /dev/tty1 itself (it chvt's and writes to the device; it never needed a
# getty) and runs the console kiosk and then the text installer AS ROOT. No login prompt in
# either outcome -- desktop when the hardware can drive it, installer when it cannot.
#
# tty2.conf still autologs the live user in on Ctrl+Alt+F2 for a hand console.

# Option to actually spawn the getty when the service starts. Set to "yes" to enable.
SPAWN="no"

# Arbitrary arguments to pass to getty.
ARGS="--autologin runink --noclear"

# Getty program to use.
GETTY="agetty"
