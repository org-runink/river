# Runink River live medium: tty1 logs the live user in automatically, exactly as tty2 does.
#
# WITHOUT THIS FILE tty1 ran a plain getty and ASKED FOR A LOGIN. On a machine where the
# desktop does not start, that was the first thing the live medium showed: a username and
# password prompt on a stick whose entire job is to let someone try the system and install it
# (owner, 2026-10-03: "the last image is what needs to start over the flash disk, not asking
# the user to login"). The credentials are live-session user/password in profile.yaml, so the
# prompt protected nothing -- it only stopped people who did not know them.
#
# river-live-fallback writes its banner and starts the installer on /dev/tty1, so this is also
# what lets that fallback be SEEN rather than sitting behind a login prompt.
#
# Live overlay only: 20-clone-rootfs drops --autologin on installed machines, which boot to the
# SDDM greeter.

# Option to actually spawn the getty when the service starts. Set to "yes" to enable.
SPAWN="yes"

# Arbitrary arguments to pass to getty.
ARGS="--autologin runink --noclear"

# Getty program to use.
GETTY="agetty"
