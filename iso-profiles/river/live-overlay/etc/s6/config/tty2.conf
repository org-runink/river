# Runink River live medium: tty2 (Ctrl+Alt+F2) logs the live user in
# automatically, a console that works when the graphical session does not (and the one
# build/qemu-test.sh --profile workstation drives). Live overlay only: 20-clone-rootfs drops
# --autologin on installed machines.

# Option to actually spawn the getty when the service starts. Set to "yes" to enable.
SPAWN="yes"

# Arbitrary arguments to pass to getty.
ARGS="--autologin runink --noclear"

# Getty program to use.
GETTY="agetty"
