# Runink River live medium: SDDM logs the live user straight into Plasma (Wayland).
# Live overlay only (profile.yaml `livefs:`): 20-clone-rootfs deletes this file on installed
# machines, which boot to the SDDM greeter. (Artix does this with artix-live, which edits an
# /etc/sddm.conf this image does not have; see the header of profile.yaml.)
# DisplayServer: SDDM's shipped default is x11 (usr/lib/sddm/sddm.conf.d/default.conf) and
# NOTHING overrode it. Session= below names plasma.desktop, which this image ships in
# /usr/share/wayland-sessions/ -- the X11 directory holds plasmax11.desktop and nothing else.
# So SDDM was told to log in to a session that does not exist in the directory it searches, and
# it did exactly what that implies: it started, stayed up and healthy (pid alive, no restarts,
# 14 minutes), opened no display server, wrote no log, and never produced a session. From the
# outside that is indistinguishable from a broken graphics driver, which is what the fallback
# told the owner it was -- on a machine whose i915 had initialised cleanly and loaded its DMC
# firmware (owner's hardware, 2026-10-03).
#
# Autologin does not need a greeter compositor: SDDM runs the session directly through
# /usr/share/sddm/scripts/wayland-session, which this image ships. That matters because
# SDDM's default CompositorCommand is `weston --shell=kiosk` and weston is NOT installed here
# (kwin_wayland is). An installed machine, which boots to the GREETER rather than autologin,
# therefore still needs that question answered -- it is not answered by this file, which the
# install removes. See the note in profile.yaml.
[General]
DisplayServer=wayland

[Autologin]
User=runink
Session=plasma.desktop
Relogin=false
