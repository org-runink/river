# Runink River live medium: SDDM logs the live user straight into Plasma (Wayland).
# Live overlay only (profile.yaml `livefs:`): 20-clone-rootfs deletes this file on installed
# machines, which boot to the SDDM greeter. (Artix does this with artix-live, which edits an
# /etc/sddm.conf this image does not have; see the header of profile.yaml.)
# DisplayServer IS DELIBERATELY NOT SET HERE, and that is a decision rather than an omission.
#
# It was briefly set to wayland to fix a machine whose desktop never started: SDDM sat up for
# fourteen minutes with no compositor, no socket and no log. The reasoning was that SDDM could
# not resolve Session=plasma.desktop, which this image ships in /usr/share/wayland-sessions/,
# while DisplayServer defaulted to x11 and the X11 directory holds only plasmax11.desktop.
#
# THAT REASONING IS DISPROVEN. The build before it ran with the x11 default and the SAME
# Session= line, and the installer appeared -- so SDDM does find that session under x11. The
# change also REGRESSED the VM test from a drawn installer (screenshot mean 10543) to a black
# screen (mean 0.68), which now fails the build outright rather than passing with a "check the
# screenshot" note.
#
# Owner decision, 2026-10-03: revert to the x11 default. A change whose justification has been
# disproven should not ship because it might still help, and it demonstrably broke the only
# automated check there is. The desktop failure on that machine stays an OPEN BUG, to be
# diagnosed from the machine -- SDDM's own log under /run/log/sddm on a live medium, where
# /var/log is not writable -- rather than guessed at a third time.
[Autologin]
User=runink
Session=plasma.desktop
Relogin=false
