---
# artools 0.39+ profile for Runink River, the developer workstation: the live/installer ISO (s6).
#
# THIS is the file artools reads. Packages-Root is NOT read by artools — it feeds
# `make lint` (closure policy) and `make lock`. And because 20-clone-rootfs.sh installs by
# rsyncing the LIVE rootfs onto the ZFS target, `rootfs.packages` below is effectively the
# INSTALLED package set too. Adding a package to Packages-Root without adding it here
# changes nothing that ships.
#
# Artix + s6 + encrypted ZFS root + linux-runink + grub + DEsk on Wayland. Deliberately
# ABSENT: a Kubernetes node, NAT64 and any platform runtime; a downstream distribution that
# needs them builds its own profile (docs/BUILD.md, "Downstream distributions").
#
# TWO LAYERS (the `livefs:` key at the bottom turns the second one on):
#   rootfs  LiveOS/rootfs.img: the golden system. Installed machines are a clone of it.
#   livefs  LiveOS/livefs.img: live-medium only, an overlay on rootfs. It holds live-overlay/
#           (the live greetd session, the tty2 autologin, the live user's sudo, the live
#           hostname), the livefs packages (Packages-Live), and artools' live-session
#           configuration (the live user, the enabled services).
# Without a `livefs:` key artools builds rootfs alone and NEVER copies live-overlay/, and runs
# its live-session configuration on the rootfs itself. With a key it also installs common.yaml's
# packages-xorg and packages-misc (X server + drivers, XWayland, fonts, xdg-user-dirs), which a
# desktop wants.
#
# NO artix-live. artools' own live setup (artix-live-s6) edits /etc/sddm.conf, which this image
# does not have, turns on any swap partition it finds on the machine's disks, and rewrites the
# locale, keymap and timezone from lang=/keytable=/tz= boot parameters. The live session here is
# plain configuration in live-overlay/ instead, and scripts/patch-artools.go stops artools from
# making sddm-srv depend on the artix-live service it does not install (the first workstation
# ISO, 2026-09-25, failed on exactly that dangling dependency).
live-session:
  user: runink
  password: runink
  # artools' `autologin` only reaches artix-live's live.conf, which this image does not read.
  # The live session logs in through live-overlay/etc/greetd/live.toml (greetd's initial
  # session: the installer, full screen in weston) and live-overlay/etc/s6/config/tty2.conf (a
  # console on Ctrl+Alt+F2); 20-clone-rootfs removes both from installed machines.
  autologin: true
  # false selects common.yaml's packages-xorg set (X11 + XWayland), which DEsk's X11 programs
  # run on.
  use-xlibre: false
  # Enabled with `s6 set enable` in the live set, which 20-clone-rootfs carries to the target;
  # 80-enable-s6 re-asserts them there. s6 refuses a set where an enabled service depends on a
  # disabled one, so every dependency below is in the list too.
  services:
    # runink-fw: the boot-time network oneshot, before NetworkManager and sshd (their
    # dependencies.d/runink-fw), on the live medium too: it clears rfkill SOFT blocks and then
    # loads the host firewall (default-deny input, forward default-drop).
    - runink-fw
    # zfs-mount: `zfs mount -a` at boot. The initramfs mounts only the boot environment; the
    # pool's other datasets (<pool>/home at /home) are its siblings and nothing else mounts
    # them. mount-filesystems and greetd-srv depend on it: without it /home was an empty
    # directory on the installed machine and no desktop session could start (qemu-gui-test
    # plasma-login, 2026-09-26, under the previous desktop). On the live medium
    # no pool is imported and it mounts nothing.
    - zfs-mount
    # river-perms: the shadow-grade modes oneshot (invariant 4).
    - river-perms
    - NetworkManager
    # NO wpa_supplicant SERVICE here, deliberately -- only the package, which Packages-Root
    # installs. NetworkManager does NOT use Artix's wpa_supplicant s6 service; it starts its own
    # supplicant over D-Bus from /usr/share/dbus-1/system-services/fi.w1.wpa_supplicant1.service
    # ("Exec=/usr/bin/wpa_supplicant -u -s -O /run/wpa_supplicant"), and only a `-u` instance
    # speaks the control interface NM drives.
    #
    # The s6 service was enabled here on 2026-10-03 against the owner's "no wifi found during
    # the installation". It cannot have helped: its run.user is
    # `wpa_supplicant -i ${WPA_INTERFACE} -c /etc/wpa_supplicant/wpa_supplicant.conf` with
    # WPA_INTERFACE defaulting to wlan0 (etc/s6/config/wpa_supplicant.conf), while the medium
    # sets no net.ifnames=0 -- so the interface is wlp0s20f3 on the owner's XPS 13 9300 -- and
    # /etc/wpa_supplicant/ ships EMPTY, so the -c file does not exist either. It exits
    # immediately on both counts and s6 restarts it forever. Verified against the shipped
    # 20261005 image, 2026-10-05: driver, firmware, root symlink farm and the 8086:34f0 ->
    # iwlwifi PCI alias are all present and correct, so the radio was never the problem.
    - sshd
    # NO chrony here, deliberately. This list is the LIVE session's, and the live layer
    # (Packages-Live) installs only runink-grub-live — chrony and chrony-s6 are in
    # Packages-Root, i.e. the installed system. Listing it here made artools warn
    # "Service chrony not found", and adding a root-overlay directory to satisfy that
    # turned the warning into a FATAL: s6 then found etc/s6/sv/chrony-srv with no `type`
    # file (those come from the package, which the live layer does not have) and
    # s6-rc-repo-sync aborted make_livefs(). The clock belongs to the installed node, and
    # 80-enable-s6 puts it in that node's boot bundle and FAILS the install if it is absent.
    # If the live medium ever needs a synced clock, chrony + chrony-s6 have to go into
    # Packages-Live and the livefs package list, not into an overlay directory.
    # The display manager is declared HERE, as a service name — artools 0.39 has no
    # `displaymanager:` key. Its s6 service comes from runink-greetd-s6 (packages-init.s6
    # below; Artix has no greetd-s6), which also depends on the plymouth-quit oneshot
    # (root-overlay/etc/s6/adminsv/plymouth-quit).
    - greetd
    # s6-rc bundle names from bluez-s6 (bluetoothd) and cups-s6 (cupsd), declared in
    # packages-init.s6 below. Enabled in the live default bundle, which 20-clone-rootfs.sh
    # carries to the installed target, exactly as greetd is; 80-enable-s6 re-asserts all three
    # there.
    - bluetoothd
    - cupsd
    # river-installer: the graphical installer's backend on [::1]:47660 (live medium only;
    # docs/INSTALL.md). The live session opens it in Firefox (etc/xdg/autostart).
    # DO NOT LIST rc-local HERE. It runs /etc/s6/rc.local, which on the live medium starts
    # river-live-fallback, and it IS in the live boot database -- but by way of Artix's
    # default bundle, not this list. `s6-rc -a list` on the shipped 2026-10-18 ISO has it in
    # the active set.
    #
    # It was added to this list on 2026-10-18 and broke the ISO build. artools' services.sh
    # enables each name here against the live service STORE, where rc-local is not present
    # at that point, so the build logged
    #     ==> WARNING: Service rc-local not found. Skipping.
    # and then failed its own check: "the live session's s6 services were not all enabled".
    # It was the only name of the ten that failed.
    #
    # It was added on a finding that was itself wrong -- that rc.local had never run on a
    # live boot. Listing a compiled s6 database by its `servicedirs/` directory shows
    # LONGRUNS ONLY, so every oneshot River supplies (rc-local, runink-fw, zfs-mount,
    # river-perms) looks absent there on a perfectly good image; `s6-rc-db ... type` on the
    # booted ISO says oneshot for all four. Check membership with `s6-rc -a list` or
    # `s6-rc-db contents default`, never by listing servicedirs.
    #
    # What actually kept the fallback from being seen was the autologin getty on VT 1: it
    # held the terminal the fallback writes to, while starving SDDM into a crash loop (see
    # live-overlay/etc/s6/config/tty1.conf).
    - river-installer
  user-services:
    - dbus
    - pipewire
    - pipewire-pulse
    - wireplumber
rootfs:
  packages:
    # live-boot essentials (squashfs tooling). runink-grub-live, the live GRUB scaffolding,
    # is in the livefs layer below: artools reads the live menu from that layer when one
    # exists.
    #
    # NO mkinitcpio-nfs-utils (removed 2026-10-01). It ships `ipconfig` and `nfsmount` for
    # mkinitcpio's `net` hook, i.e. an NFS root — and no initramfs built for this image names
    # that hook: the live one comes from iso-initcpio's /etc/mkinitcpio-default.conf
    # (base udev artix_shutdown artix artix_loop_mnt artix_kms modconf block filesystems
    # keyboard keymap) and the installed one from root-overlay/etc/mkinitcpio.conf.d/zfs.conf.
    # Nothing in the tree referenced it; docs/OWN-BASE.md already listed it as a drop.
    - grub
    - squashfs-tools
    # base ops + installer tooling. git and curl are here on purpose: this machine.s job is
    # cloning repositories and building them.
    - openssh
    - rsync
    - vim
    # The terminal greeting (etc/profile.d/runink-greeting.sh): a static fastfetch summary
    # that any login shell sources. The login shell is bash, which `base` already provides,
    # so no package is needed for it.
    - fastfetch
    - sudo
    - git
    - curl
    - dialog
    - parted
    - gptfdisk
    - dosfstools
    # river-sandbox runs untrusted code under bubblewrap (invariant 8).
    - bubblewrap
    # river-hwprobe + river-plan (the install plan and serial confirmation) and river-netsetup
    # + river-netcheck (the network-first step the live session opens with).
    - runink-installer
    - artools-base
    - nftables
    # ── desktop: DEsk on Wayland ──────────────────────────────────────────────────────
    # DEsk replaced KDE Plasma (owner decision 2026-10-30): the desktop, the login screen
    # (greetd + gtkgreet in cage) and the GTK programs it opens. Rationale in Packages-Root.
    - runink-desk
    - runink-wlroots0.18
    - greetd
    - runink-cage
    - runink-gtkgreet
    - libelogind
    - mate-polkit
    - network-manager-applet
    - nm-connection-editor
    - gnome-keyring
    - xdg-desktop-portal
    - xdg-desktop-portal-wlr
    - xdg-desktop-portal-gtk
    - xorg-xwayland
    - xdg-user-dirs
    - xdg-utils
    - wdisplays
    - grim
    - wl-clipboard
    - libnotify
    - gsfonts
    - foot
    - thunar
    - tumbler
    - gvfs
    - udisks2
    - mousepad
    - ristretto
    - atril
    - engrampa
    - parole
    - firefox
    # Boot splash — the Runink River Plymouth theme. See Packages-Root for why it is s6-clean.
    - plymouth
    # ── graphics: mesa ────────────────────────────────────────────────────────────────
    # vulkan-radeon for the AMD reference machine; vulkan-intel so one image also serves
    # Intel hardware.
    - mesa
    - vulkan-icd-loader
    - vulkan-radeon
    - vulkan-intel
    - libva-mesa-driver
    # ── multimedia: codecs + hardware video ─────────────────────────────────────────
    # intel-media-driver = Meteor Lake VA-API (iHD); libva-utils = vainfo.
    - gst-plugins-base
    - gst-plugins-good
    - gst-plugins-bad
    - gst-plugins-ugly
    - gst-libav
    - ffmpeg
    - intel-media-driver
    - libva-utils
    # ── audio ─────────────────────────────────────────────────────────────────────────
    - pipewire
    - pipewire-pulse
    - pipewire-alsa
    - wireplumber
    - pipewire-jack
    # ── bluetooth + printing ─────────────────────────────────────────────────────────
    # No Bluetooth or printer program (blueman and system-config-printer are Python); see Packages-Root.
    - bluez
    - bluez-utils
    - cups
    # ── fonts ─────────────────────────────────────────────────────────────────────────
    - ttf-dejavu
    - ttf-liberation
    - noto-fonts
    - noto-fonts-emoji
    - noto-fonts-cjk
    # NO noto-fonts-extra (removed 2026-10-01): 331 MiB of extra WIDTHS and WEIGHTS of
    # families noto-fonts already ships. Rationale in Packages-Root.
    # ── developer toolchain ───────────────────────────────────────────────────────────
    # A developer toolchain: base-devel (C/C++) and go.
    - base-devel
    - go
    - zstd
    # ── firmware ──────────────────────────────────────────────────────────────────────
    # A workstation fleet is not one SKU: the reference machine is AMD (Radeon/HawkPoint) and amdgpu
    # will not initialise without its firmware split.
    - linux-firmware-amdgpu
    - linux-firmware-intel
    # network firmware for non-Intel hardware -- see Packages-Root for why
    - linux-firmware-realtek
    - linux-firmware-broadcom
    - linux-firmware-atheros
    - linux-firmware-mediatek
    - linux-firmware-qcom
    - linux-firmware-marvell
    # ── ZFS root ──────────────────────────────────────────────────────────────────────
    # The kernel swap (2026-09-06). The kernel is
    # linux-runink (zen-kernel 7.2.x stable fork, 7.2.7-zen1), installed via scripts/patch-artools.go's
    # common.yaml rewrite, because NO available OpenZFS package built against Artix's
    # linux-lts 6.18.49 — zfs-dkms 2.3.3 fails to compile and archzfs's prebuilt module
    # targets 6.12. runink-zfs is OpenZFS 2.4.4 stable, built against linux-runink-headers.
    #
    # runink-zfs is prebuilt for that kernel, so no headers and no DKMS toolchain are needed
    # on the installed image. runink-zfs-utils supplies the userland and the `zfs`
    # initcpio hook that OpenZFS upstream does not ship; it is split from the same PKGBUILD
    # and signed 2.4.4 tarball as runink-zfs, which pins it (runink-zfs-utils=2.4.4). It
    # replaced archzfs's zfs-utils, which served 2.3.3 against the 2.4.4 modules.
    - runink-zfs
    - runink-zfs-utils
  packages-init:
    s6:
      - openssh-s6
      - networkmanager-s6
      # greetd, the display manager: Runink River's own -s6 package (Artix has none).
      - runink-greetd-s6
      # bluetoothd and cupsd s6-rc services (see live-session.services above).
      - bluez-s6
      - cups-s6
livefs:
  packages:
    # Exactly Packages-Live (river lint profile-manifest). LIVE ONLY: never in rootfs.img,
    # and 20-clone-rootfs removes it from installed machines (the install clones the running
    # live system, which includes this layer).
    #
    # The live GRUB scaffolding artools copies to the ISO (make_grub reads it from THIS
    # layer when a livefs exists), ours since 2026-10-01: build/pkgbuilds/runink-grub-live
    # provides exactly the /usr/share/grub paths prepare_grub() touches, and no artix-*
    # package. The menu itself is iso-profiles/river/grub/, which
    # scripts/patch-artools.go copies over whatever this layer supplied.
    - runink-grub-live
    # weston: the reference Wayland compositor, run with its kiosk shell. It replaced
    # wpewebkit on 2026-10-05. river-live-fallback's chain is a graphical session, else
    # river-kiosk, else the text installer, and the kiosk used to be WPE WebKit's MiniBrowser
    # drawn straight onto KMS/DRM with no compositor. That wants a hardware cursor plane and a
    # GPU renderer, which a plain EFI framebuffer does not have -- so it failed on exactly the
    # machines that needed a fallback, including the owner's XPS 13 9300 (five aborts in ten
    # seconds, "No suitable DRM device found") on a laptop where CachyOS, Manjaro and Fedora
    # all open their installer without trouble. Those distributions do the boring thing: boot a
    # session and run the installer as a window in it. weston's kiosk-shell is exactly that --
    # one application, fullscreen -- and weston renders through pixman where there is no GPU.
    # Since DEsk replaced Plasma it is also the live medium's FIRST path: greetd's initial
    # session runs weston as the live user (live-overlay/etc/greetd/live.toml), and weston.ini
    # autolaunches river-installer-desktop. firefox is already in Packages-Root, so this adds a
    # small compositor and drops a whole second browser engine. weston 15.0.1 is in `world`.
    # Live-only: an installed workstation has DEsk and a browser and no use for the kiosk.
    - weston
