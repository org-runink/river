# chrony.conf — time synchronisation for Runink River.
#
# Replaces the package default so the sources are ours and the appliance behaviour is
# explicit. Nothing on this image synchronised time before 2026-10-02, and an unsynchronised
# clock is not cosmetic: TLS certificates are rejected as not-yet-valid or expired, k0s and
# Kubernetes client certificates and tokens fail the same way, and GitHub App JWTs are refused
# with "'Expiration time' claim ('exp') is too far in the future" — which is how a runner on an
# image built from this profile had every private-repo CI job 401 after drifting ~39 seconds
# ahead of GitHub.

# NTS (Network Time Security) where the pool offers it, so the time source is authenticated
# rather than merely reachable: a machine that trusts an unauthenticated clock can be walked
# backwards into accepting an expired certificate.
server time.cloudflare.com iburst nts
server ptbtime1.ptb.de iburst nts
# Unauthenticated fallbacks. A node that can reach neither NTS server is still better off
# roughly right than freely drifting, and `authselectmode require` is deliberately NOT set for
# that reason — see docs/INSTALL.md if your threat model says otherwise.
pool pool.ntp.org iburst

driftfile /var/lib/chrony/drift
# Cache the NTS-KE keys and cookies, so a restart resumes authenticated time instead of
# redoing the key exchange with every source.
ntsdumpdir /var/lib/chrony

# Step rather than slew while the error is large, but only for the first few updates: a node
# whose RTC is minutes or hours out (fresh hardware, a dead coin cell, a VM restored from a
# snapshot) must arrive at the right time in seconds, not hours. After that, only slew, so a
# running node's clock never jumps under a database or a log.
makestep 1.0 3

# Write the system time back to the RTC, so the next boot starts close even before the network
# is up. This is the half that keeps a rebooted node from starting wrong every time.
rtcsync

# Never serve time to anyone: this is a client. (chrony does not listen by default; stated
# because an appliance's firewall posture should not be the only thing enforcing it.)
port 0
cmdport 0

# AIR-GAPPED AND LAN-ONLY NODES: there is nothing to reach here, and chrony will simply log
# that and leave the clock alone, which is the correct failure. Point it at the site's own
# source instead — one `server <host> iburst` line, and drop the three above. An enrolled
# private node should take this from enrollment rather than keeping the public pool.
