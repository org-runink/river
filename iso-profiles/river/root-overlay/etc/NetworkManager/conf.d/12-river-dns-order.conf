# Runink River — resolver order: a network's IPv4 resolvers before its IPv6 ones (a lower
# dns-priority comes first). The IPv4 fallback resolvers are added after them by the
# dispatcher.d/40-river-dns-fallback hook (/etc/river/dns-fallback.conf).
[connection]
ipv4.dns-priority=50
ipv6.dns-priority=100
