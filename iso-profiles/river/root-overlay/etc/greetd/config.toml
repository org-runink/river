#
# greetd on Runink River: the login screen is gtkgreet, full screen in cage (a one-window
# Wayland compositor), on VT 1, styled with the Runink River wallpaper and palette
# (branding/greeter/gtkgreet.css). Whoever logs in gets DEsk (desk-session). The live medium uses
# /etc/greetd/live.toml instead (the greetd service, runink-greetd-s6).
[terminal]
vt = 1

[default_session]
command = "cage -s -- gtkgreet -s /usr/share/runink/branding/greeter/gtkgreet.css -c desk-session"
user = "greeter"
