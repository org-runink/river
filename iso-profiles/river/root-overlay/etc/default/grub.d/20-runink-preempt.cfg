# Runink River: full kernel preemption for a responsive desktop.
#
# linux-runink is built with the analytics / throughput profile (PREEMPT_LAZY default,
# HZ 250) (docs/KERNEL.md). The kernel keeps
# PREEMPT_DYNAMIC, so the preemption model is a boot parameter: `preempt=full` gives the
# desktop the full preemption zen's desktop configuration used to compile in, on the
# same kernel binary (docs/KERNEL.md, "Analytics profile"). grub-mkconfig sources this file
# after the installer's 10-runink-zfs.cfg.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT preempt=full"
