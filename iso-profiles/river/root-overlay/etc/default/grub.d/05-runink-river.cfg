# Runink River — the installed boot menu's name. grub-mkconfig titles its entries
# "<GRUB_DISTRIBUTOR> Linux"; without this they would carry the base distribution's name.
# The theme, timeout and kernel command line come from 10-runink-zfs.cfg, which the installer
# writes (installer/lib/40-boot-grub-zfs.sh).
GRUB_DISTRIBUTOR="Runink River"
