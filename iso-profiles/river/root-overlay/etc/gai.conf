# Runink River — address selection (getaddrinfo, RFC 6724 precedence).
#
# Internal traffic is IPv6 (unique-local fc00::/7: a cluster, a mesh) and is tried first.
# For every other destination IPv4 comes before global IPv6, so an external service stays
# reachable when the network's IPv6 path fails. Loopback stays first. Remove this file to
# get the RFC 6724 defaults back.
precedence ::1/128        50
precedence fc00::/7       45
precedence ::ffff:0:0/96  40
precedence ::/0           35
precedence 2002::/16      30
precedence ::/96          20
