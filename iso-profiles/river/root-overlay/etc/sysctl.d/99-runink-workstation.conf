# Runink River VM tuning. (A server holding resident model weights wants the opposite,
# vm.swappiness=10, with zram only as an OOM backstop.)
#
# A workstation's zram is not a backstop, it is the point. The device is sized by the install
# plan (RAM/2 below 32 GiB, else RAM/4, at most 16 GiB; 1:1 with RAM without a plan, see
# runink-zram.sh) and backed by zstd, so a swapped page costs a compress/decompress
# — microseconds against RAM, not the milliseconds of a disk. Under that arrangement the
# kernel's disk-era defaults are actively wrong: they hoard anonymous pages that would cost
# almost nothing to compress, and evict page cache instead.
#
# Measured on the reference workstation: 5.6 GB of swapped data occupying 2.6 GB of RAM,
# ~2.15x. That is 3 GB of headroom the defaults would not have produced.

# 150, not the default 60. Above 100 the kernel will evict anonymous pages in preference to
# page cache — correct only when the swap device is faster than the filesystem, which is
# exactly true for zram and false for a disk. Matches the reference workstation.
vm.swappiness=150

# 0 means "read one page at a time" (2^0). The default 3 reads 8 pages per fault, which is
# an optimisation for rotational seek latency. zram has no seek: the readahead just burns
# CPU decompressing pages nothing asked for. This must be 0 wherever zram is the primary
# swap, and it is the setting most often missed.
vm.page-cluster=0

# 0 disables the watermark boost that triggers extra reclaim on fragmentation. On an
# interactive desktop with compressed swap it causes reclaim storms that read as stutter.
vm.watermark_boost_factor=0
