# Runink River — kernel security hardening.
#
# Separate from the desktop tuning (99-runink-workstation.conf) so the security posture is
# legible on its own. Every key here is safe with a developer desktop: Plasma, browsers,
# debuggers of your own processes, rootless tools. Unprivileged user namespaces are left at
# the kernel default because river-sandbox (bubblewrap, invariant 8) and browser sandboxes
# depend on them.

# Hide kernel pointers from unprivileged readers (/proc/kallsyms, etc.) so a local
# bug can't trivially defeat KASLR. 2 = hide from everyone regardless of privilege.
kernel.kptr_restrict=2

# Restrict dmesg to CAP_SYSLOG — the kernel log leaks addresses, secrets, and probe
# output useful to an attacker enumerating the host.
kernel.dmesg_restrict=1

# Disable kexec: loading a new kernel over the running one is a persistence /
# secure-boot-bypass primitive this machine never needs (it boots one linux-runink BE).
kernel.kexec_load_disabled=1

# Yama: a process may ptrace only its own descendants (blocks cross-process memory
# scraping between unrelated programs). A debugger still attaches to what it starts; attach
# to a running process with sudo.
kernel.yama.ptrace_scope=1

# Harden the BPF JIT with constant blinding, mitigating JIT-spray.
net.core.bpf_jit_harden=2

# Restrict perf_event_open to user-space profiling of your own processes (2): kernel
# profiling needs sudo.
kernel.perf_event_paranoid=2

# ── Filesystem hardening ─────────────────────────────────────────────────────
# Refuse to follow symlinks/hardlinks in world-writable sticky dirs (/tmp) unless
# the follower owns the link target — closes the classic /tmp symlink-race class.
fs.protected_symlinks=1
fs.protected_hardlinks=1
# Same idea for FIFOs and regular files in sticky world-writable dirs (a service
# must not be tricked into opening an attacker's file planted in /tmp).
fs.protected_fifos=2
fs.protected_regular=2
# Never core-dump a setuid process (the dump would leak its elevated-context memory).
fs.suid_dumpable=0

# Full address-space layout randomization (stack, mmap, brk, vdso). Usually the
# default; set explicitly so a vendor image change can't silently weaken it.
kernel.randomize_va_space=2

# ── Network hardening ────────────────────────────────────────────────────────
# NOTE: deliberately NOT touching rp_filter (breaks asymmetric routing on multi-homed
# laptops and VPNs) or accept_ra (the machine gets its IPv6 address via SLAAC).
#
# Ignore ICMP redirects: a peer must not rewrite this machine's routing table (MITM
# primitive).
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
# Don't emit redirects either (avoids leaking topology to a LAN peer).
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
# Drop source-routed packets — a spoofing/steering vector with no legitimate use here.
net.ipv6.conf.all.accept_source_route=0
net.ipv6.conf.default.accept_source_route=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
# Log packets with impossible (spoofed) source addresses for after-the-fact triage.
net.ipv4.conf.all.log_martians=1
