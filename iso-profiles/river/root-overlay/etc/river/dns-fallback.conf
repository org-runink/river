# Runink River — IPv4 fallback resolvers (river-netcheck dns-compose, run by the
# NetworkManager dispatcher hook dispatcher.d/40-river-dns-fallback).
#
# After every network change, /etc/resolv.conf becomes: the network's first resolver (it
# answers the local names), its other IPv4 resolvers, these fallbacks, then its IPv6
# resolvers. Added only while the machine has an IPv4 default route: an IPv6-only network
# has no IPv4 path, and its resolv.conf is left as NetworkManager wrote it.
#
# FALLBACK_DNS: IPv4 addresses, space- or comma-separated. Empty disables the fallback.
# Default: Quad9 (a public, non-logging resolver). Change it to your own if you prefer.
FALLBACK_DNS="9.9.9.9 149.112.112.112"
# DNS_OPTIONS: resolver options that replace NetworkManager's same keys.
DNS_OPTIONS="timeout:2 attempts:2"
