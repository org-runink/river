# RIVER workstation — ZFS-root initramfs, with the Plymouth splash.
#
# Same base as iso-profiles/river/root-overlay/etc/mkinitcpio.conf.d/zfs.conf (udev/busybox
# initramfs, NOT systemd; `zfs` before `filesystems`; hostid baked by 40-boot-grub-zfs.sh),
# plus the `plymouth` hook. This profile had NO drop-in before this file, so its initramfs
# was built from the stock /etc/mkinitcpio.conf HOOKS, which has no `zfs` hook — i.e. a
# ZFS root that the initramfs could not import. Adding the splash is what surfaced it.
#
# plymouth sits after `kms` (the DRM driver must be in the image for the splash to take
# the display) and before `block`/`zfs`, so the animation covers the pool import. Its
# hook has a non-systemd path: without the systemd hook it calls add_runscript and runs
# from the busybox init (run_hook starts plymouthd, run_latehook hands it the new root).
# It needs 71-seat.rules, which elogind ships. The splash only shows with `splash` on the
# kernel cmdline, which 40-boot-grub-zfs.sh adds when this profile's theme is present.
MODULES=(zfs)

HOOKS=(base udev autodetect microcode modconf kms plymouth keyboard keymap block zfs filesystems)

COMPRESSION="zstd"
