# Runink River — SDDM uses the Runink River greeter theme (usr/share/sddm/themes/runink-river,
# rendered from branding/src/sddm/runink-river by branding/render.sh): the dark palette, the
# river-lines background and the animated community mark. SDDM loads it with Qt 6
# (metadata.desktop QtVersion=6); it imports only QtQuick and QtQuick.Controls.Basic
# (qt6-declarative, a dependency of sddm) and draws SVGs through qt6-svg.
[Theme]
Current=runink-river

# THE GREETER RUNS ON WAYLAND, and the second key is the reason the first one is safe.
#
# DisplayServer=wayland was tried alone on 2026-10-03 and reverted the same day: the greeter
# came up with no compositor, no socket and no log, and the QEMU harness went from a drawn
# installer (screenshot mean 10543) to a black screen (mean 0.68). The owner's note asked for
# that to be diagnosed rather than guessed at a third time.
#
# The diagnosis is CompositorCommand. SDDM's Wayland greeter does not draw anything itself; it
# starts a compositor and runs the greeter inside it. With no CompositorCommand set, SDDM falls
# back to its compiled-in default, which on this image resolves to nothing usable -- so the
# greeter has no surface to draw on. A greeter with no compositor is precisely "no compositor,
# no socket and no log", and a black screen is what that looks like to a screenshot test.
#
# kwin_wayland is the compositor this image already ships for the session itself (`kwin`,
# Packages-Root), so the greeter is not a new dependency -- only a second, short-lived instance
# of a compositor that is on the medium either way. The flags keep that instance out of the
# way of the session that follows it:
#   --no-lockscreen         the greeter IS the lock surface; a second one would race it
#   --no-global-shortcuts   no desktop shortcuts belong to a login prompt
#   --locale1               take the locale from localed, as the session does
#
# NOT SET ON THE LIVE MEDIUM, on purpose. live-overlay/etc/sddm.conf.d/50-live-autologin.conf
# autologins, so no greeter is shown there and this key would change nothing a user sees while
# re-entering exactly the configuration that regressed the harness. The live file documents
# that decision; leave it alone.
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=kwin_wayland --no-lockscreen --no-global-shortcuts --locale1
