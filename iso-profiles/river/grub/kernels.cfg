#
# The Runink River live entries (see grub.cfg next to this file). artools fills in
# @kopts@ (label=<ISO label> overlay=livefs) and @ro_opts@ when it builds the ISO.
# The second entry is for GPUs the kernel's modesetting driver cannot drive yet: nomodeset
# leaves the firmware framebuffer in place, and Plasma starts on software rendering.

menuentry "Runink River — Install / Live" --id runink-live --class river {
	linux /boot/vmlinuz-x86_64 @kopts@ @ro_opts@ ${kopts}
	initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
}
menuentry "Runink River — Install / Live (safe graphics)" --id runink-live-safe --class river {
	linux /boot/vmlinuz-x86_64 @kopts@ @ro_opts@ ${kopts} nomodeset
	initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
}
