#
# The Runink River live entries (see grub.cfg next to this file). artools fills in
# @kopts@ (label=<ISO label> overlay=livefs) and @ro_opts@ when it builds the ISO.
#
# `quiet splash` shows the Runink River splash (plymouth, theme `river`) from the kernel to the
# session, with a progress bar; Esc on the splash shows the boot messages behind it. The live
# initramfs carries the plymouth hook (scripts/patch-artools.go, step 2b).
#
# 1. Try or Install (default): the live DEsk desktop, straight from the stick, with an
#    "Install Runink River" launcher. The disks are not touched until the installer
#    is run and its erase is confirmed.
# 2. Install only: the installer full screen (weston kiosk), no desktop (river.installer=1).
# 3. Safe graphics: for GPUs the kernel's modesetting driver cannot drive yet; nomodeset
#    leaves the firmware framebuffer in place.
# 4. Show boot messages: no splash and no `quiet`, every kernel and service line on screen.
# 5. Text installer: no graphics at all.
# The fallback chain behind every graphical entry is unchanged: graphical session, then the
# weston kiosk (river-kiosk), then the text installer (river-live-fallback).

menuentry "Runink River — Try or Install" --id runink-live --class river {
	linux /boot/vmlinuz-x86_64 @kopts@ @ro_opts@ ${kopts} quiet splash
	initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
}
menuentry "Runink River — Install only (installer full screen)" --id runink-live-install --class river {
	linux /boot/vmlinuz-x86_64 @kopts@ @ro_opts@ ${kopts} quiet splash river.installer=1
	initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
}
menuentry "Runink River — Try or Install (safe graphics)" --id runink-live-safe --class river {
	linux /boot/vmlinuz-x86_64 @kopts@ @ro_opts@ ${kopts} nomodeset quiet splash
	initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
}
# Every boot message on the screen: the entry for a stick that stops somewhere during start-up.
# plymouth.enable=0 keeps the splash off; without `quiet` the kernel and the s6 services print
# their status lines on the console as they start.
menuentry "Runink River — Try or Install (show boot messages)" --id runink-live-verbose --class river {
	linux /boot/vmlinuz-x86_64 @kopts@ @ro_opts@ ${kopts} plymouth.enable=0
	initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
}
# The text installer, with no graphics at all: the entry to pick when a stick "does nothing" or
# shows a blank screen. river.text makes the greetd service decline to start (so there is no
# compositor, no seat service and no DRM client) and river-live-fallback open the text installer
# on the console. nomodeset keeps the kernel on the firmware framebuffer, so the console is
# readable on any display; plymouth.enable=0 keeps a splash off it.
menuentry "Runink River — Text installer (no graphics)" --id runink-live-text --class river {
	linux /boot/vmlinuz-x86_64 @kopts@ @ro_opts@ ${kopts} nomodeset plymouth.enable=0 river.text=1
	initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
}
