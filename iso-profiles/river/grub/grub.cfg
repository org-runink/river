#
# The Runink River live menu: /boot/grub/grub.cfg on the ISO.
#
# It is copied over whatever the livefs layer's GRUB package left at /boot/grub/grub.cfg
# (scripts/patch-artools.go does that during buildiso, with kernels.cfg next to it). Since
# 2026-10-01 that package is our own, build/pkgbuilds/runink-grub-live, which deliberately
# ships NO menu because this file is the menu. Before it, the package was Artix's
# artix-grub-live, whose menu put a clock
# entry and tz / keytable / lang submenus above the boot entries; those only fed artix-live's
# boot-time locale setup, which this image does not install, so on this image they would
# change nothing. It also loaded efi_uga, which GRUB's x86_64-efi build does not have.
#
# Also sourced by loopback.cfg (runink-grub-live ships it) when a multi-image stick boots
# this ISO as a file: then iso_path is set, and the live initramfs is told where the image
# file is.

insmod part_gpt
insmod part_msdos
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg
insmod font

if loadfont /boot/grub/unicode.pf2; then
	set gfxmode=1024x768,auto
	set gfxpayload=keep
	terminal_output gfxterm
	if [ -f /boot/grub/themes/river/theme.txt ]; then
		set theme=/boot/grub/themes/river/theme.txt
		export theme
	fi
fi

set kopts=""
if [ -n "${iso_path}" ]; then
	set kopts="img_dev=/dev/disk/by-uuid/${rootuuid} img_loop=${iso_path}"
fi
export kopts

set default=runink-live
set timeout=10
set timeout_style=menu

source /boot/grub/kernels.cfg
