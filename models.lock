# models.lock — the AI models a Runink River node serves, pinned to their upstream Hugging Face repos.
#
# One file per line, eight whitespace-separated columns:
#
#   role  repo  revision  file  size  sha256  license  dest
#
#   role      the inference role that loads it: general, coder, vision, stt, embedding, tts
#   repo      Hugging Face repo, <org>/<name>
#   revision  the exact 40-hex commit the file is fetched at, never a branch
#   file      path inside the repo at that revision
#   size      bytes. Checked before the hash, so a truncated file fails fast
#   sha256    of the exact file. THIS is the pin. For LFS files it is the sha256 Hugging Face
#             records for the LFS object, and the download is re-hashed locally. For the small
#             non-LFS files it was computed from the file fetched at `revision`. A mirror
#             (RIVER_MODELS_MIRROR) can only ever serve these bytes
#   license   SPDX id from the model card (cardData.license) at that revision (tts: see below)
#   dest      path under MODELS_DIR (/var/lib/core/models/shared on a node, mounted read-only
#             into the inference pods at /models). `-` = the file's basename at the root
#
# Fetched at ISO BUILD time only, by build/models-fetch.sh (resume, sha256 verification,
# mirror fallback). build/50-models-manifest.sh verifies MODELS_DIR against this lock and
# writes models.manifest. An installed node never fetches a model.
#
# Model-card evidence (quotes pinned to each revision) and the load-test results for every
# row are in models.evidence.json. Short form, all measured 2026-09-24:
#
#   coder      Qwen3-14B Q4_K_M, the model maker's own GGUF. Loads in mistral.rs 0.9.2
#              (`serve text --format gguf`).
#   stt        Voxtral-Mini-4B-Realtime-2602, the model maker's safetensors, quantized at load
#              (`serve multimodal --isq q4k`). No GGUF form loads in mistral.rs 0.9.2: the
#              maker's audio.cpp GGUF has no companion projector, and the 3B-2507 GGUF is
#              refused by the multimodal loader. Only consolidated.safetensors is pinned
#              (params.json makes the loader read that Mistral-format file), not the
#              byte-identical-weights model.safetensors (another 8.9 GB).
#   embedding  PENDING: no row. mistral.rs is the only inference engine (decided 2026-09-27),
#              and the previously pinned nomic-embed-text-v1.5 Q8_0 GGUF does not load in it
#              (mistral.rs 0.9.2: "Embedding models do not support GGUF or GGML format", and no
#              nomic-bert architecture). The embedding model is being re-selected for one
#              mistral.rs serves; its output dimension must match the vector indexes (768).
#              models.tiers marks the tier `pending=embedding` until then.
#
#   vision     Qwen3-VL-2B-Instruct Q4_K_M + mmproj Q8_0, the model maker's own GGUFs, served by
#              mistral.rs 0.9.2 (`serve multimodal --format gguf --quantized-file ... --mmproj
#              ...`). Its tokenizer and config assets are pinned too, from the base repo at
#              its own revision: without a LOCAL `--tok-model-id` directory mistral.rs resolves
#              them against huggingface.co at load time, and a node never fetches. All nine
#              were fetched at that revision and re-hashed on 2026-09-24. Known limit: bounding
#              boxes come back 0-1000 normalised, not in pixels.
#   tts        piper voices (medium, 22050 Hz) from rhasspy/piper-voices: en_GB jenny_dioco,
#              es_ES davefx, fr_FR siwis, pt_BR faber, pt_PT tugão. The .onnx pins are the LFS
#              sha256 Hugging Face records; the .onnx.json pins were computed from the files
#              fetched at that revision. `license` here is the VOICE DATASET licence from each
#              voice's MODEL_CARD (the repository itself is MIT), because that is the licence
#              with obligations: fr_FR siwis is CC-BY-4.0 and jenny_dioco requires the voice
#              to be credited as "Jenny (Dioco)" (dataset README, github.com/dioco-group/
#              jenny-tts-dataset). `dest` renames tugão to ASCII (pt_PT-tugao-medium); the
#              .onnx and its .onnx.json keep the same stem, which is how piper pairs them.
#
# general is the coder row: one Qwen3-14B process serves both roles, so it needs no row of its
# own (models.evidence.json records the decision).

