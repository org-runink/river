# ── Third-party derived files ───────────────────────────────────────────────────────────
# Adapted from Artix iso-profiles (BSD-2-Clause). Upstream notice kept to be safe; drops when
# these are rewritten for River's own base (docs/LICENSING.md).
[[annotations]]
path = [
  "iso-profiles/*/profile.yaml",
  "iso-profiles/*/profile.conf",
  "iso-profiles/*/Packages-Root",
  "iso-profiles/*/Packages-Live",
]
SPDX-FileCopyrightText = ["2026 The RIVER Authors", "2017 Cromnix GNU/Linux"]
SPDX-License-Identifier = "MIT AND BSD-2-Clause"

# ── Kernel packaging tree: GPL-2.0-only ─────────────────────────────────────────────────
[[annotations]]
path = "build/pkgbuilds/runink-kernel/**"
SPDX-FileCopyrightText = "2026 The RIVER Authors"
SPDX-License-Identifier = "GPL-2.0-only"

# Kernel PKGBUILD: River's work (GPL-2.0-only) on top of Arch's linux-zen PKGBUILD
# (Arch packaging, 0BSD per Arch RFC 0040).
[[annotations]]
path = "build/pkgbuilds/runink-kernel/PKGBUILD"
SPDX-FileCopyrightText = ["2026 The RIVER Authors", "Arch Linux contributors (linux-zen)"]
SPDX-License-Identifier = "GPL-2.0-only AND 0BSD"

# Kernel config: olddefconfig output of Arch's linux-zen config.x86_64 (Arch packaging, 0BSD).
[[annotations]]
path = "build/pkgbuilds/runink-kernel/config.base"
SPDX-FileCopyrightText = "Arch Linux contributors (linux-zen)"
SPDX-License-Identifier = "0BSD"

# bpfdoc: a Go port of the Linux kernel's scripts/bpf_doc.py (GPL-2.0-only), which the kernel
# PKGBUILD builds in place of that script so the kernel builds without Python. A port of kernel
# code, so GPL-2.0-only like the script. (build/pkgbuilds/runink-kernel/bpfdoc.go is a symbolic
# link to its main.go.)
[[annotations]]
path = "build/tools/bpfdoc/**"
SPDX-FileCopyrightText = ["2018-2019 Netronome Systems, Inc.", "2021 Isovalent, Inc.", "2026 The RIVER Authors"]
SPDX-License-Identifier = "GPL-2.0-only"

# bpfdoc's test fixtures, from Linux 7.2.7 (build/tools/bpfdoc/testdata/README): the uapi header
# tools/include/uapi/linux/bpf.h, and the bpf_helper_defs.h that upstream bpf_doc.py generated
# from it (the header's documentation, reformatted). Both carry the header's licence.
[[annotations]]
path = "build/tools/bpfdoc/testdata/*.gz"
SPDX-FileCopyrightText = ["2011-2014 PLUMgrid, http://plumgrid.com", "Linux kernel BPF contributors"]
SPDX-License-Identifier = "GPL-2.0-only WITH Linux-syscall-note"

# ── OpenZFS packaging tree: CDDL-1.0 ────────────────────────────────────────────────────
[[annotations]]
path = "build/pkgbuilds/runink-zfs/**"
SPDX-FileCopyrightText = "2026 The RIVER Authors"
SPDX-License-Identifier = "CDDL-1.0"

# archzfs initcpio hook, vendored byte-for-byte @ d85933f5 and sha256-pinned in the PKGBUILD.
# Must NOT get an in-file header (it would break the pin). archzfs README: "The license of
# the Arch Linux package sources is MIT" (no LICENSE file upstream; FLAG).
[[annotations]]
path = [
  "build/pkgbuilds/runink-zfs/zfs-utils.initcpio.hook",
  "build/pkgbuilds/runink-zfs/zfs-utils.initcpio.install",
]
SPDX-FileCopyrightText = "archzfs contributors"
SPDX-License-Identifier = "MIT"

# runink-zfs PKGBUILD: its package function mirrors archzfs's package_zfs-utils.
[[annotations]]
path = ["build/pkgbuilds/runink-zfs/PKGBUILD", "build/pkgbuilds/runink-zfs/runink-zfs.install"]
SPDX-FileCopyrightText = ["2026 The RIVER Authors", "archzfs contributors"]
SPDX-License-Identifier = "CDDL-1.0 AND MIT"

# AUR packaging (packaging/aur/): packaging scripts are MIT (the "**" default). The
# linux-runink PKGBUILD follows Arch's linux-zen PKGBUILD (Arch packaging, 0BSD per Arch
# RFC 0040). The packages they BUILD carry their own licences in the license= field
# (GPL-2.0-only for the kernel, CDDL-1.0 for OpenZFS).
[[annotations]]
path = "packaging/aur/linux-runink/PKGBUILD"
SPDX-FileCopyrightText = ["2026 The RIVER Authors", "Arch Linux contributors (linux-zen)"]
SPDX-License-Identifier = "MIT AND 0BSD"

# Upstream release signers' public keys (verification only).
[[annotations]]
path = ["build/pkgbuilds/*/keys/pgp/*.asc", "packaging/aur/*/keys/pgp/*.asc"]
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Public-Key"

# The Runink River release public key (KEYS), and the copy the image ships as the pacman
# keyring for [runink] (docs/REPOSITORY.md).
[[annotations]]
path = ["base/keys/owner/*.asc", "iso-profiles/river/root-overlay/usr/share/pacman/keyrings/runink.gpg"]
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Public-Key"

# The hardware-adaptive installer (river-hwprobe, river-plan, their fixtures), the
# one-line entry point and its KEYS file: MIT by owner decision (2026-09-24). Last, so it
# wins over the defaults above.
[[annotations]]
path = [
  "installer/go.mod",
  "installer/hwprobe/**",
  "installer/plan/**",
  "installer/internal/**",
  "installer/lib/hwplan.sh",
  "installer/lib/05-hwplan-verify.sh",
  "installer/lib/75-install-plan.sh",
  "iso-profiles/river/root-overlay/usr/local/lib/runink-install/hwplan.sh",
  "iso-profiles/river/root-overlay/usr/local/lib/runink-install/05-hwplan-verify.sh",
  "iso-profiles/river/root-overlay/usr/local/lib/runink-install/75-install-plan.sh",
  "install.sh",
  "KEYS",
]
SPDX-FileCopyrightText = "2026 The RIVER Authors"
SPDX-License-Identifier = "MIT"

# river-guide (the install guide agent) and the public Runink River install guide it embeds:
# MIT, owner decision 2026-09-24. Same as the default; listed last so no broader
# annotation above (e.g. the branding CC-BY-4.0 globs) can ever claim these files.
[[annotations]]
path = [
  "guide/**",
  "build/pkgbuilds/river-guide/**",
  "build/25-river-guide.sh",
]
SPDX-FileCopyrightText = "2026 The RIVER Authors"
SPDX-License-Identifier = "MIT"

# The documentation website (website/) is River's own (the MIT default above), except its two
# vendored third-party inputs, pinned by `river lint docs-vendor`:
#   * the Hextra Hugo theme v0.12.3 (github.com/imfing/hextra, tag commit 8e53e7a7), vendored
#     byte-for-byte by `hugo mod vendor`, with its upstream LICENSE (MIT, "Copyright (c) 2023
#     Xin") alongside;
#   * FlexSearch 0.8.143 (npm flexsearch, dist/flexsearch.bundle.min.js), Apache-2.0; its
#     header names the author. Provenance: website/assets/lib/flexsearch/SOURCE.
# The pages reference the Runink River mark from branding/logo/ (mounted by website/hugo.toml),
# never a copy, so the trademark annotation above stays the only one for it.
[[annotations]]
path = ["website/_vendor/github.com/imfing/hextra/**", "website/static/third-party/hextra-LICENSE.txt"]
SPDX-FileCopyrightText = "2023 Xin"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "website/assets/lib/flexsearch/flexsearch.bundle.min.js"
SPDX-FileCopyrightText = "Thomas Wilkerling, Nextapps GmbH"
SPDX-License-Identifier = "Apache-2.0"

# The home page's typefaces, served from the site itself (no third-party font host):
