  "iso-profiles/river/root-overlay/usr/share/sddm/themes/runink-river/metadata.desktop",
  "iso-profiles/river/root-overlay/usr/share/sddm/themes/runink-river/theme.conf",
  "iso-profiles/river/root-overlay/usr/share/plasma/look-and-feel/org.runink.river.desktop/contents/splash/RiverLockup.qml",
