  "branding/sddm/runink-river/background.jpg",
  "iso-profiles/river/root-overlay/usr/share/sddm/themes/runink-river/background.jpg",
]
SPDX-FileCopyrightText = "2026 The RIVER Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# ...and the mark's layers and the wordmark it animates are Runink brand assets.
