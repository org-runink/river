SPDX-License-Identifier = "MIT"

# Plasma look-and-feel package: its own metadata.json declares "GPLv2+". Mapped as declared.
[[annotations]]
path = "iso-profiles/river/root-overlay/usr/share/plasma/look-and-feel/org.runink.river.desktop/**"
SPDX-FileCopyrightText = "2026 The RIVER Authors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# ...except its splash images, the layers of the community mark and the wordmark (brand assets, as above).
[[annotations]]
