#
# REUSE 3.x mapping (https://reuse.software/spec-3.3/). See docs/LICENSING.md.
#
# RIVER's licensing (decided):
#   * MIT            — everything RIVER authors by default: installer, scripts, build
#                      tooling, configuration, overlays, CI, documentation. Root LICENSE.
#   * GPL-2.0-only   — the kernel packaging tree (build/pkgbuilds/runink-kernel/): River's
#                      kernel config/patch work is a modification of Linux.
#   * CDDL-1.0       — the OpenZFS package tree (build/pkgbuilds/runink-zfs/), matching the
#                      OpenZFS code it builds into a SEPARATE out-of-tree module package
#                      (docs/governance/ZFS-LICENSING.md).
#   * CC-BY-4.0      — RIVER artwork (not code). The RIVER name and marks are not licensed.
#   * LicenseRef-Runink-Trademark — the Runink brand assets, all rights reserved.
#   * Third-party files keep their upstream licences (BSD-2-Clause, 0BSD, MIT, GPL-3.0-only,
#     GPL-2.0-or-later, public keys).
#
# Rule: when several annotations match a path, the LAST one wins. So: broad defaults first,
# specific overrides after. An in-file SPDX header takes precedence over this file
# (precedence "closest", the default).
version = 1

# ── River's own files (default) ─────────────────────────────────────────────────────────
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 The RIVER Authors"
SPDX-License-Identifier = "MIT"

# Runink River artwork and its baked overlay copies. The trademarks "RIVER"/"Runink" and the
# logos are NOT licensed by this entry (see docs/LICENSING.md).
[[annotations]]
path = [
  "branding/**",
  "iso-profiles/*/root-overlay/usr/share/runink/branding/**",
  "iso-profiles/*/root-overlay/usr/share/plymouth/themes/river/**",
  "iso-profiles/*/root-overlay/usr/share/wallpapers/River/**",
]
SPDX-FileCopyrightText = "2026 The RIVER Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# ...except the code and text that live beside the artwork.
[[annotations]]
path = ["branding/render.sh", "branding/**/*.md"]
SPDX-FileCopyrightText = "2026 The RIVER Authors"
SPDX-License-Identifier = "MIT"

# Runink BRAND assets: the Runink River community mark (the M2 mascot, a puppy on a raft) and
# everything rendered from it: the hicolor icons and favicons, the GRUB background, the
# Plymouth and Plasma splash logo, the Runink River wallpaper, /etc/issue. All rights
# reserved, trademark of Runink. A community build must replace them (docs/LICENSING.md).
[[annotations]]
path = [
  "branding/logo/river-mark.svg",
  "branding/logo/river-mark-small.svg",
  "branding/logo/river-lockup.svg",
  "branding/logo/river-lockup-dark.svg",
  "branding/logo/runink-tagline.svg",
  "branding/src/logo/**",
  "branding/ascii/**",
  "branding/icons/**",
  "branding/fastfetch/**",
  "branding/mascot/**",
  "branding/plymouth/river/logo.png",
  "branding/splash/**",
  "branding/grub/river/background.jpg",
  "branding/wallpapers/River/contents/images*/**",
  "branding/wallpapers/River/contents/screenshot.png",
  "iso-profiles/river/root-overlay/usr/share/icons/hicolor/**",
  "iso-profiles/river/root-overlay/usr/share/runink/branding/grub/river/background.jpg",
  "iso-profiles/river/root-overlay/usr/share/plymouth/themes/river/logo.png",
  "iso-profiles/river/root-overlay/etc/issue",
  "iso-profiles/river/root-overlay/usr/share/runink/fastfetch/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/River/contents/images*/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/River/contents/screenshot.png",
]
SPDX-FileCopyrightText = "2026 Runink"
SPDX-License-Identifier = "LicenseRef-Runink-Trademark"

# CachyOS Emerald KDE wallpapers (third party, GPL-3.0). JPEG derivatives of upstream
# github.com/CachyOS/CachyOS-Emerald-KDE @ d61d1dd0 (wallpapers/); each upstream
# metadata.desktop names the author and "X-KDE-PluginInfo-License=GPLv3" (no "or later"),
# and upstream has no LICENSE or README naming anyone else. Transform and per-file
# sha256s (upstream and derived): branding/wallpapers/emerald/PROVENANCE.
[[annotations]]
path = [
  "branding/wallpapers/emerald/*/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/Abstract/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/BlueFeathers/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/DarkStreaks/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/Dimensions/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/GreenFeathers/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/Lines/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/Liquid/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/Metal/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/OrangeFeathers/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/paper/**",
  "iso-profiles/river/root-overlay/usr/share/wallpapers/PurpleFeathers/**",
