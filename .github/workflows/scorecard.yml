#
# OpenSSF Scorecard (https://github.com/ossf/scorecard).
#
# Runs weekly, on push to main and on branch-protection changes, but ONLY once the
# repository is public (the job-level `if:` below); while private it runs on manual
# dispatch only, deliberately. It runs on the self-hosted `public-ci` runners, owner-only, and
# none of its triggers is a pull request:
#   * publish_results is false: the Scorecard API accepts published results only from a
#     GitHub-hosted runner (scorecard-action README, "Workflow Restrictions"), and those are
#     no longer used, so the README's Scorecard badge stops updating. No id-token is needed.
#   * SARIF upload to code scanning needs GitHub Advanced Security on a private repo, so
#     it is also gated on visibility. The SARIF is always kept as a run artifact.
#   * On a private repo several checks (Branch-Protection, ...) need a fine-grained PAT
#     in the SCORECARD_TOKEN secret. Without it the run still completes and those checks
#     report "internal error"/-1.
#
name: OpenSSF Scorecard

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: (github.event_name == 'workflow_dispatch' || github.event.repository.visibility == 'public') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, public-ci]
    timeout-minutes: 15
    permissions:
      security-events: write   # upload SARIF to code scanning (public repos only, gated below)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: false   # the Scorecard API takes only GitHub-hosted runs

      - name: Keep the SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 14

      - name: Upload to code scanning (public repos only)
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
