# /etc/s6.conf — where the s6 command (s6-frontend) finds things. These are also the values
# compiled into s6-rc and s6-frontend in [runink]; the file states them so they can be read.
scandir = /run/service
livedir = /run/s6-rc
repodir = /etc/s6/repo
bootdb = /etc/s6/rc/compiled
storelist = /etc/s6/adminsv:/etc/s6/sv
verbosity = 1
