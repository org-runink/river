#
# /boot/grub/loopback.cfg on a Runink River ISO.
#
# GRUB reads this file INSTEAD of grub.cfg when the image is booted as a FILE rather than
# from its own medium: a multiboot stick (build/make-multiboot-usb.sh) loop-mounts the ISO
# and `configfile`s it, and GRUB's loopback convention is to look for loopback.cfg first.
# It sets ${iso_path} before doing so, which is exactly what the profile's grub.cfg reads
# to tell the live initramfs where the image file is (img_dev=/img_loop=), so there is
# nothing to do here but hand over to the one menu.
source /boot/grub/grub.cfg
