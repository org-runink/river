<?xml version="1.0" encoding="UTF-8"?>
<!-- Runink River GRUB background, 1920x1080. SOURCE of branding/grub/river/background.jpg
     (branding/render.sh). The menu, countdown bar and label are drawn by GRUB on top of
     this from theme.txt, so the middle band (y 36%..80%) is deliberately empty.
     Crop-safe: theme.txt crops (never stretches) onto a 4:3 mode, which keeps only
     x 240..1680 of this canvas at 1024x768, so the lockup stays inside that window.
     RIVER-ART: branding/render.sh swaps in branding/logo/river-lockup-dark.svg (the community
     mark, the "Runink River" wordmark and the meaning of the name, one source). Original artwork; colours from
     branding/palette.md: ground, lines in card and muted, ONE sage strand. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#212121"/>
      <stop offset="1" stop-color="#2C2E30"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#ground)"/>
  <!-- RIVER-ART src=logo/river-lockup-dark.svg x=960 y=112 height=128 anchor=middle -->
