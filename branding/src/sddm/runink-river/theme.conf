# Runink River SDDM theme (usr/share/sddm/themes/runink-river). SDDM reads this file, then
# theme.conf.user beside it (the file the SDDM settings page writes) on top.
#
# background: an image path (absolute, or relative to this directory). Empty: the theme's
#   own background.jpg (the dark wallpaper's river lines).
# motion: false keeps the community mark still (the raft never bobs). SDDM exposes no
#   reduced-motion setting, so this is it.
# showClock: false hides the clock.
[General]
background=
motion=true
showClock=true
