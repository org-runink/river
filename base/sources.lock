# base/sources.lock — every upstream byte the own base builds from, pinned.
#
# One source per line, six whitespace-separated columns:
#
#   name  version  sha256  url  sig_url  sig_key
#
#   name     the key a recipe names in its `sources=` list (recipes carry no URLs)
#   version  must equal the recipe's pkgver when the recipe is named after the source
#   sha256   of the exact file at `url`. THIS is the pin — a mirror (RIVER_BASE_MIRROR) can
#            only ever serve these bytes
#   url      upstream location; the build host fetches it once into the cache
#   sig_url  detached OpenPGP signature over the same file, or `-` if upstream publishes none
#   sig_key  full primary-key fingerprint that must have made that signature; the public key
#            is base/keys/pgp/<fingerprint>.asc (armored, reviewable in a diff —
#            the same convention as build/pkgbuilds/runink-zfs/keys/pgp). `-` iff sig_url is `-`
#
# A source with no upstream signature needs a `# nosig: <name> <reason>` line, so the gap is
# written down next to the pin instead of silently accepted. `river-build lint` enforces it.
#
# HOW THESE HASHES WERE OBTAINED (2026-09-23): each tarball was downloaded over HTTPS from
# skarnet.org, hashed locally with sha256sum, and compared with the `.sha256` file upstream
# publishes beside it. They matched. That second file comes from the same origin, so it is a
# transcription check, not independent provenance.
#
# nosig: skalibs  skarnet.org publishes a .sha256 per release but no OpenPGP signature
# nosig: execline skarnet.org publishes a .sha256 per release but no OpenPGP signature
# nosig: s6       skarnet.org publishes a .sha256 per release but no OpenPGP signature

